services:
  relay:
    build: .
    image: remote-shell-bot:0.2.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RSB_RELAY_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - rsb-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rsb-data:
