name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q

  package:
    name: Wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . -w dist
      - name: Check packaged assets
        run: |
          python -c "import glob, zipfile; path=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(path).namelist(); required=['rsb/agent/static/index.html','rsb/db/schema.sql','rsb/net/vpn.py']; missing=[item for item in required if item not in names]; assert not missing, missing; print('wheel ok:', path)"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t remote-shell-bot:ci .
      - name: Smoke test entrypoint
        run: docker run --rm remote-shell-bot:ci rsb --help
